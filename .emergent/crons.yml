crons:
  - name: daily-blog-post
    description: "Writes, SEO-optimizes and publishes (or drafts) one new blog post every morning at 7am Central"
    cron: "0 7 * * *"
    timezone: "America/Chicago"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-post"
    method: POST
    enabled: true
  - name: daily-lead-digest
    description: "Emails Ernesto a morning summary of new leads, today's meetings and overdue tasks"
    cron: "30 7 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/lead-digest"
    method: POST
    enabled: true
  - name: daily-rank-check
    description: "Checks Google rank for every published blog post's focus keyword via DataForSEO"
    cron: "0 8 * * *"
    timezone: "America/Chicago"
    endpoint: "{{BASE_URL}}/api/cron/rank-check"
    method: POST
    enabled: true
